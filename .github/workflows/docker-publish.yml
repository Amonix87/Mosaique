name: Construire et publier l'image Docker

# À chaque push sur main, construit l'image et la publie sur GitHub Container Registry (ghcr.io)
# avec l'étiquette `latest` (et le hash court du commit, pour pouvoir revenir en arrière si besoin).
# Votre serveur n'a alors plus qu'à faire `docker compose pull && docker compose up -d`.
on:
  push:
    branches: [main]
  workflow_dispatch: {} # permet aussi de relancer la publication manuellement depuis l'onglet Actions

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # nécessaire pour pousser l'image sur ghcr.io avec le jeton automatique du workflow
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3 # pour pouvoir construire aussi en arm64 (Raspberry Pi...)
      - uses: docker/setup-buildx-action@v3

      - name: Connexion à ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construction et publication
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
