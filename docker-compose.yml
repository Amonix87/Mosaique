services:
  mosaique:
    # Image publiée automatiquement par GitHub Actions à chaque mise à jour du dépôt
    # (voir .github/workflows/docker-publish.yml) : mettre à jour = `docker compose pull`
    # puis `docker compose up -d`, sans rien construire sur votre serveur.
    image: ghcr.io/amonix87/mosaique:latest
    # Alternative : construire directement depuis le dépôt GitHub (plus lent, mais pas besoin
    # d'attendre que l'image se publie après un push). Remplacez #main par une autre branche/tag.
    # build: https://github.com/Amonix87/Mosaique.git#main
    # Alternative : construire depuis un clone local déjà présent sur le serveur.
    # build: .
    container_name: mosaique
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - mosaique-data:/data
      # Stockage séparé pour les photos du fil familial (facultatif).
      # Par défaut, elles sont rangées dans le volume ci-dessus (data/uploads/posts).
      # Pour les stocker ailleurs (un disque dédié aux photos, un NAS...), montez
      # un chemin de votre choix ici et indiquez-le à MEDIA_DIR ci-dessous, par exemple :
      #   - /mnt/nas/photos-famille:/media
      - mosaique-media:/media
    environment:
      # Nécessaire si vous placez Mosaïque derrière un reverse proxy HTTPS
      # (Nginx, Caddy, Traefik...) afin que le cookie de session soit marqué "Secure".
      - TRUST_PROXY=1
      # Emplacement de stockage des photos du fil familial (voir le volume ci-dessus).
      - MEDIA_DIR=/media

      # --- Notifications par e-mail (facultatif) ---
      # Renseignez ces variables pour permettre à chacun d'activer, dans son compte,
      # la réception de ses notifications par e-mail en plus de l'application.
      # - SMTP_HOST=smtp.exemple.fr
      # - SMTP_PORT=587
      # - SMTP_USER=mosaique@exemple.fr
      # - SMTP_PASS=votre-mot-de-passe-ou-cle-app
      # - SMTP_FROM=Mosaïque <mosaique@exemple.fr>
      # SMTP_SECURE=1 pour une connexion SSL/TLS directe (port 465 typiquement).
      # - SMTP_SECURE=0
      # Adresse publique de votre instance, utilisée pour les liens dans les e-mails.
      # - PUBLIC_URL=https://monfamille.exemple.fr

      # --- Connexion avec Authelia / un fournisseur OpenID Connect (facultatif) ---
      # Ajoute un bouton « Se connecter avec Authelia » sur l'écran de connexion. Voir le README
      # (section « Connexion avec Authelia ») pour la configuration côté Authelia.
      # - OIDC_ISSUER=https://auth.exemple.fr
      # - OIDC_CLIENT_ID=mosaique
      # - OIDC_CLIENT_SECRET=le-secret-en-clair-declare-dans-authelia
      # Libellé du bouton (« Se connecter avec … ») :
      # - OIDC_NAME=Authelia
      # OIDC_PASSWORD_LOGIN=0 masque le mot de passe : seule la connexion par le fournisseur reste possible.
      # - OIDC_PASSWORD_LOGIN=1

volumes:
  mosaique-data:
  mosaique-media:
